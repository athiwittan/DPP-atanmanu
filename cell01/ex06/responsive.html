<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Responsive</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .first  { background-color: lightgreen; }
      .second { background-color: salmon; }
      table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
      }
      td {
        width: 50%;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td class="first">First cell</td>
        <td class="second">Second cell</td>
      </tr>
    </table>

  </body>
</html>
